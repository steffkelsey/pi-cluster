---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=yes cache_valid_time=600

    - name: Wait for systemd to complete initialization.  # noqa 303
      command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_facts["service_mgr"] == 'systemd'
      changed_when: false
      failed_when: systemctl_status.rc > 1

    - name: Make sure curl and fuse-overlayfs are present.
      ansible.builtin.package:
        name: 
          - curl
          - fuse-overlayfs
        state: present

    - name: Check if cgroup2 is already mounted for Cilium
      ansible.builtin.command: mountpoint -q /run/cilium/cgroupv2
      register: cilium_cgroup_mounted
      failed_when: false
      changed_when: false

    - name: Create Cilium cgroupv2 directory
      ansible.builtin.file:
        path: /run/cilium/cgroupv2
        state: directory
        mode: '0755'
      when: cilium_cgroup_mounted.rc != 0

    - name: Mount cgroup2 for Cilium
      ansible.builtin.mount:
        path: /run/cilium/cgroupv2
        src: none
        fstype: cgroup2
        state: mounted
        opts: rw,nosuid,nodev,noexec

    - name: Ensure cgroupv2 mount is shared
      ansible.builtin.command: mount --make-shared /run/cilium/cgroupv2
      register: cgroup_shared
      changed_when: false

    - name: Ensure sys fs bpf mount is shared
      ansible.builtin.command: mount --make-shared /sys/fs/bpf
      register: bpf_shared
      changed_when: false

- import_playbook: ../../main.yml
