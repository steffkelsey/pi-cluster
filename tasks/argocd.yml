---
- name: Argocd - Git checkout HEAD of repo containing application sets
  ansible.builtin.git:
    repo: 'https://github.com/steffkelsey/homelab-live.git'
    dest: ~/github/homelab-live
    single_branch: true

- name: ArgoCD - Add the argocd Helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "https://argoproj.github.io/argo-helm"

- name: Argocd - Deploy latest version of ArgoCD chart into argocd namespace
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Argocd - Create ApplicationSets in k8s from file
  kubernetes.core.k8s:
    state: present
    src: ~/github/homelab-live/application-sets/production.yaml
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  vars:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python"
